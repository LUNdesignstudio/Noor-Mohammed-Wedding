<style>

/* envelope */
#env{position:fixed;inset:0;z-index:100;background:linear-gradient(160deg,#efe3d3,#e6d6c3);display:flex;align-items:center;justify-content:center;transition:opacity 1s .5s}
#env .flap{position:absolute;top:0;left:0;right:0;height:52%;background:#f3e8da;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .9s;filter:drop-shadow(0 6px 8px #0002)}
#env .seal{position:relative;z-index:2;display:grid;place-items:center;width:140px;height:140px;padding:0;border-radius:50%;border:0;cursor:pointer;background:none;margin-top:-4%;transition:transform .5s,opacity .4s;animation:pulse 2s infinite}

.hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.hero:after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,#3a2810aa,#3a281022 45%,#3a2810bb);pointer-events:none}
.hero>*:not(video){position:relative;z-index:2}
.monofb{font:700 7rem/1 Amiri,serif;background:linear-gradient(135deg,#f6e3a4,#b8933f 60%,#f0d890);-webkit-background-clip:text;background-clip:text;color:transparent}

.card{position:relative;isolation:isolate;border-radius:28px;padding:32px 22px}

.reveal-ready .reveal-panel.is-visible .reveal-item{opacity:1;transform:translateY(0)}

input[type=text],input[type=email],input[type=number]{width:100%;padding:16px;border-radius:16px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;margin:8px 0 14px}

@media(max-width:480px){

  .names{font-size:2.2rem}
  .cd{gap:6px}

  .row i{width:18px;height:18px}
  .row .t{padding-right:7px}
  .row .e{padding-left:7px}

  [dir=rtl] .row .e{padding-right:7px}
  .map{height:170px}
  .btns{gap:8px}
  .btns a{padding:12px 6px;font-size:.9rem}
  .choice{gap:8px}
  .choice button{padding:12px 6px;font-size:.92rem}

@media(max-width:350px){

@media(prefers-reduced-motion:reduce){

.credit{margin:-26px 0 0;padding:0 20px calc(36px + env(safe-area-inset-bottom,0px));text-align:center;font-size:.85rem;color:#8c764e;opacity:.92}.credit a{color:#8c764e;text-decoration:none;font-weight:600;display:inline-flex;align-items:center;gap:.35em;direction:ltr}.credit svg{width:1.05em;height:1.05em;flex:none}

function startReveals(){
var targets=document.querySelectorAll(".reveal-panel,.reveal-section");
if(!("IntersectionObserver" in window)){targets.forEach(function(target){target.classList.add("is-visible")});return}
var revealObserver=new IntersectionObserver(function(entries){entries.forEach(function(entry){if(entry.isIntersecting){entry.target.classList.add("is-visible");revealObserver.unobserve(entry.target)}})},{threshold:.12,rootMargin:"0px 0px -6% 0px"});
targets.forEach(function(target){revealObserver.observe(target)})
}
prepareReveals();

function tok(){var bytes=new Uint8Array(3);if(!window.crypto||!crypto.getRandomValues)throw new Error("Secure random code generation is not available.");crypto.getRandomValues(bytes);return "MN-"+Array.prototype.map.call(bytes,function(value){return ("0"+value.toString(16)).slice(-2)}).join("").toUpperCase()}
function ticketContent(nm,t,party){return ["Mohammed & Noor Wedding","Guest: "+nm,"Status: Confirmed ("+party+" "+(party==1?"Confirmed Seat":"Confirmed Seats")+")","Pass Code: "+t,"Date: December 26, 2026","Venue: Sapphire Addis Hotel (9th Floor)"].join("\n")}

function escapeHtml(value){return String(value).replace(/[&<>"']/g,function(character){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[character]})}
function buildEmailHtml(nm,t,party,qrImage){var safeName=escapeHtml(nm),safeCode=escapeHtml(t),safeCount=escapeHtml(party),safeQr=escapeHtml(qrImage);
return '<div style="margin:0;background:#fbf8f2;padding:30px 12px;color:#433c33;font-family:Georgia,serif"><div style="max-width:620px;margin:auto;background:#fffdf9;border:1px solid #ece2c9;border-radius:20px;overflow:hidden"><div style="padding:28px 20px;text-align:center;background:#f5efdf;border-bottom:1px solid #ece2c9"><div style="font-size:12px;letter-spacing:4px;color:#9b7c3f">MOHAMMED &amp; NOOR</div><h1 style="margin:12px 0 0;color:#9b7c3f;font-weight:500">Your Official Entry Pass</h1><div style="margin-top:6px;color:#7c6b4b">بطاقة الدخول الرسمية</div></div><div style="padding:26px 28px"><p>Dear <strong>'+safeName+'</strong>,</p><p>Thank you for confirming your attendance! We are overjoyed to celebrate our special day with you.</p><p>Attached below is your official <strong>Digital Entry Pass &amp; QR Code</strong>. Please save this pass to your phone or present the QR code at the entrance upon your arrival.</p><h2 style="color:#9b7c3f;font-size:19px">Event Details</h2><p>📅 <strong>Date:</strong> Saturday, December 26, 2026<br>📍 <strong>Venue:</strong> Sapphire Addis Hotel, 9th Floor<br>🎟️ <strong>Pass Code:</strong> '+safeCode+'<br><strong>Confirmed seats:</strong> '+safeCount+'</p><div style="text-align:center;margin:24px 0"><img src="'+safeQr+'" width="176" height="176" alt="Entry pass QR code" style="display:inline-block;border:12px solid #fff;border-radius:12px"><div style="margin-top:8px;color:#9b7c3f;font-size:13px">MOHAMMED &amp; NOOR · '+safeCode+'</div></div><p>We look forward to creating unforgettable memories together!</p><p>Warmest regards,<br><strong>Mohammed &amp; Noor</strong></p><hr style="border:0;border-top:1px solid #ece2c9;margin:26px 0"><div dir="rtl" lang="ar" style="font-family:Tahoma,Arial,sans-serif;line-height:2;text-align:right"><h2 style="color:#9b7c3f;font-size:20px">بطاقة الدخول الرسمية – حفل زفاف محمد ونور</h2><p><strong>'+safeName+' العزيز/ة،</strong></p><p>يسعدنا جداً تأكيد حضوركم ومشاركتنا فرحتنا في هذا اليوم المميز!</p><p>تجدون أدناه <strong>بطاقة الدخول الرقمية ورمز QR الخاص بكم</strong>. يرجى الاحتفاظ بهذه البطاقة على هاتفكم وإبراز رمز QR عند الوصول لمقر الحفل.</p><p><strong>تفاصيل المناسبة:</strong><br>📅 <strong>التاريخ:</strong> السبت، ٢٦ ديسمبر ٢٠٢٦<br>📍 <strong>الموقع:</strong> فندق سافاير أديس - الدور التاسع<br>🎟️ <strong>رمز البطاقة:</strong> '+safeCode+'<br><strong>عدد المقاعد المؤكدة:</strong> '+safeCount+'</p><p>نترقب حضوركم بشوق لنصنع معاً أجمل الذكريات.</p><p>مع خالص المحبة،<br><strong>محمد ونور</strong></p></div></div></div></div>'}
function sendPassEmail(email,nm,t,party,qrImage){if(!EMAILJS_PUBLIC_KEY||!EMAILJS_SERVICE_ID||!EMAILJS_TEMPLATE_ID)return Promise.resolve(false);
if(!window.emailjs) return Promise.reject(new Error("EmailJS failed to load."));
emailjs.init({publicKey:EMAILJS_PUBLIC_KEY});
return emailjs.send(EMAILJS_SERVICE_ID,EMAILJS_TEMPLATE_ID,{to_email:email,email:email,to_name:nm,email_subject:"Your Official Entry Pass – Mohammed & Noor’s Wedding",pass_code:t,guest_count:String(party),event_title:"Mohammed & Noor Wedding",event_date:"Saturday, December 26, 2026",venue:"Sapphire Addis Hotel, 9th Floor",qr_code:qrImage,email_html:buildEmailHtml(nm,t,party,qrImage)}).then(function(){return true})}
document.getElementById("rsvp-form").addEventListener("submit",async function(event){event.preventDefault();if(!choice||!this.checkValidity())return;
var nm=document.getElementById("nm").value.trim(),email=document.getElementById("email").value.trim(),partyInput=document.getElementById("party-count"),party=choice=="yes"?Number(partyInput.value):0,ar=lang=="ar",ok=document.getElementById("ok"),button=document.getElementById("send"),t="",st={};
ok.style.display="block";try{st=JSON.parse(localStorage.getItem("mnPass")||"{}")}catch(error){console.error("Could not read the saved wedding pass:",error)}
if(choice=="yes"){
var previous=st.t&&st.n==nm?Number(st.party)||1:0;
if(seats()+previous<party){ok.textContent=ar?"عذرًا، لا توجد مقاعد كافية للعدد المطلوب.":"Sorry, there are not enough seats for that party size.";return}
try{t=st.t&&st.n==nm?st.t:tok()}catch(error){console.error("Could not generate a pass code:",error);ok.textContent=ar?"تعذر إنشاء بطاقة الدخول. يرجى المحاولة مجددًا.":"Could not create the entry pass. Please try again.";return}
if(RSVP_URL){try{var r=await reserve(nm,email,t,party);if(r.full){ok.textContent=ar?"عذرًا، اكتمل العدد المحدد للحضور (١٥٠)، ولا يمكن إصدار بطاقات جديدة.":"Sorry, all 150 seats have been taken, so no more entry passes can be issued.";return}t=r.token||t}catch(error){console.error("RSVP server unreachable:",error);ok.textContent=ar?"تعذر الاتصال بالخادم. يرجى المحاولة مجددًا.":"Could not reach the server. Please try again.";return}}
try{localStorage.setItem("mnCount",Math.max(0,(+localStorage.getItem("mnCount")||0)-previous+party));localStorage.setItem("mnPass",JSON.stringify({n:nm,t:t,party:party}))}catch(error){console.error("Could not save the wedding RSVP locally:",error)}
showPass(nm,t,party);
var qrImage="https://api.qrserver.com/v1/create-qr-code/?size=320x320&margin=10&data="+encodeURIComponent(ticketContent(nm,t,party));
button.disabled=true;
try{var sent=await sendPassEmail(email,nm,t,party,qrImage);ok.textContent=sent?(ar?"شكرًا لكم 🤍 تم إرسال بطاقة الدخول إلى بريدكم الإلكتروني.":"Thank you 🤍 Your entry pass has been emailed to you."):(ar?"تم تأكيد حضوركم وإنشاء البطاقة. يلزم إعداد خدمة البريد لإرسالها.":"Your attendance is confirmed and the pass is ready. Email delivery needs to be configured.");}
catch(error){console.error("Could not email the wedding entry pass:",error);ok.textContent=ar?"تم تأكيد حضوركم، لكن تعذر إرسال البريد الإلكتروني. يرجى حفظ رمز QR أو المحاولة لاحقًا.":"Your attendance is confirmed, but the email could not be sent. Please save the QR code or try again later.";if(location.search.indexOf("debug")>-1)ok.textContent+=" ["+(error&&error.status?error.status+" ":"")+((error&&(error.text||error.message))||String(error))+"]"}
finally{button.disabled=false}
}else{document.getElementById("pass").style.display="none";if(RSVP_URL)reserve(nm,email,"",0).catch(function(error){console.error("Could not log the decline:",error)});try{var oldCount=+localStorage.getItem("mnCount")||0;if(st.t&&st.n==nm)localStorage.setItem("mnCount",Math.max(0,oldCount-(Number(st.party)||1)));if(st.t&&st.n==nm)localStorage.removeItem("mnPass")}catch(error){console.error("Could not update the saved wedding RSVP:",error)}ok.textContent=ar?"شكرًا لكم 🤍":"Thank you 🤍"}
var msg=(ar?(choice=="yes"?"أؤكد حضوري لحفل زفاف محمد ونور. الاسم: ":"أعتذر عن الحضور لحفل زفاف محمد ونور. الاسم: ")+nm:(choice=="yes"?"I will attend Mohammed & Noor’s wedding. Name: ":"I’m sorry, I can’t attend Mohammed & Noor’s wedding. Name: ")+nm)+(t?(ar?" · الرمز: ":" · Code: ")+t:"");
if(WA)window.open("https://wa.me/"+WA+"?text="+encodeURIComponent(msg),"_blank");
else if(!t)try{await navigator.clipboard.writeText(msg)}catch(error){console.error("Could not copy the RSVP response:",error)}});
setLang("ar");
</script>
